<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Privacy-focused, offline-first document editor. A free, open-source alternative to Microsoft Word and Google Docs." />
    <meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0f" media="(prefers-color-scheme: dark)" />
    <meta name="application-name" content="Penko Writer" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Penko Writer" />
    <meta name="referrer" content="no-referrer" />
    <!-- The web app manifest <link> is injected by vite-plugin-pwa (base-aware). -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%penguin-logo.svg?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <title>Penko Writer</title>
    <style>
      :root {
        --bg-color: #f8fafc;
        --sidebar-bg: #ffffff;
        --surface-color: #ffffff;
      }
      .dark {
        --bg-color: #0f0f0f;
        --sidebar-bg: #111111;
        --surface-color: #1e1e1e;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        overflow: hidden; /* App handles scrolling */
        transition: background-color 0.3s ease;
      }
      
      /* Modern Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #333; 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      /* Firefox has no ::-webkit-scrollbar: same thin look with the standard properties
         (guarded, because Chromium drops its ::-webkit-scrollbar styling once scrollbar-color is set) */
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width: thin; }
        :root { scrollbar-color: #cbd5e1 transparent; }
        :root.dark { scrollbar-color: #333 transparent; }
      }

      /* Soft Page Shadow */
      .page-shadow {
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      }
      .dark .page-shadow {
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }
      
      /* Editor Content Specific Styles */
      #editor-content ul {
        list-style-type: disc;
        padding-left: 2em;
        margin-bottom: 0.5em;
      }
      #editor-content ol {
        list-style-type: decimal;
        padding-left: 2em;
        margin-bottom: 0.5em;
      }
      #editor-content li {
        margin-bottom: 0.25em;
      }

      /* Selected Image Style */
      .selected-img {
          outline: 3px solid #3b82f6;
          box-shadow: 0 0 0 1px white, 0 4px 6px rgba(0,0,0,0.3);
      }

      /* Print styles */
      @media print {
        body * {
          visibility: hidden;
        }
        #editor-content, #editor-content * {
          visibility: visible;
        }
        #editor-content {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 0;
          box-shadow: none;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
</head>
  <body>
    <noscript>
      <div style="font-family: sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; text-align: center; color: #334155;">
        <h1 style="font-size: 1.5rem;">Penko Writer needs JavaScript</h1>
        <p>Penko Writer is a word processor that runs entirely in your browser. Please enable JavaScript to use it.</p>
      </div>
    </noscript>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
